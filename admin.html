<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ubumenyi Hub Admin | Manage Platform Content & Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="/style/admin.css">
</head>
<body>
<div class="admin-wrapper">
    <!-- Sidebar -->
    <div class="admin-sidebar">
        <div class="sidebar-logo">
            <h2><i class="fas fa-graduation-cap"></i> UBUMENYI HUB</h2>
            <span>Admin Control Center</span>
        </div>
        <div class="sidebar-nav">
            <div class="nav-item active" data-tab="dashboard">
                <i class="fas fa-chart-pie"></i> <span>Dashboard</span>
            </div>
            <div class="nav-item" data-tab="manage-content">
                <i class="fas fa-folder-open"></i> <span>Manage Chapters</span>
            </div>
            <div class="nav-item" data-tab="users">
                <i class="fas fa-users"></i> <span>All Users</span>
            </div>
            <div class="nav-item" data-tab="popular">
                <i class="fas fa-fire"></i> <span>Most Viewed</span>
            </div>
        </div>
    </div>

    <div class="admin-main" id="adminMainPanel">
        <!-- dynamic content injected -->
    </div>
</div>

<!-- MODAL: Add New Chapter (Video or Book) -->
<div id="chapterModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-plus-circle"></i> Post New Chapter</h3>
        <form id="newChapterForm">
            <div class="form-group">
                <label>Chapter Title *</label>
                <input type="text" id="chapterTitle" required placeholder="e.g., Advanced Python for Data">
            </div>
            <div class="form-group">
                <label>Content Type *</label>
                <select id="chapterType" required>
                    <option value="video">🎥 Video Lesson</option>
                    <option value="book">📘 Digital Book / Guide</option>
                </select>
            </div>
            <div class="form-group">
                <label>Resource URL (YouTube, PDF, ebook link) *</label>
                <input type="text" id="chapterUrl" required placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Short Description</label>
                <textarea rows="2" id="chapterDesc" placeholder="Topics covered, duration, etc..."></textarea>
            </div>
            <div class="flex-buttons">
                <button type="button" class="btn-outline" id="closeModalBtn">Cancel</button>
                <button type="submit" class="btn-primary">Publish Chapter</button>
            </div>
        </form>
    </div>
</div>

<script>
    // ======================= DATA MODELS (aligned with ubumenyi ecosystem) =======================
    // Chapters (video or book) that represent learning content
    let chapters = [
        { id: "ch_1", title: "Introduction to Smart Equipment (Kinyarwanda)", type: "video", url: "https://ubumenyi.rw/lesson/intro-equipment", description: "Video lesson: basics of modern tools & safety", viewCount: 1542 },
        { id: "ch_2", title: "Safety Protocols & Drills Guide", type: "video", url: "https://ubumenyi.rw/lesson/safety-drills", description: "Bilingual safety walkthrough", viewCount: 987 },
        { id: "ch_3", title: "Blockchain Credentials Handbook", type: "book", url: "https://ubumenyi.rw/books/blockchain-creds", description: "Interactive digital book about verifiable certificates", viewCount: 643 },
        { id: "ch_4", title: "Simulation Walkthroughs (Advanced)", type: "video", url: "https://ubumenyi.rw/lesson/simulations", description: "Hands-on simulation for equipment handling", viewCount: 2103 },
        { id: "ch_5", title: "Rwanda Digital Transformation Guide", type: "book", url: "https://ubumenyi.rw/books/digital-rwanda", description: "Policy & industry standards", viewCount: 452 }
    ];

    // Platform Users (students + teachers)
    let platformUsers = [
        { id: 1, name: "Alice Uwase", email: "alice@ubumenyi.rw", role: "Student", enrolled: "Jan 2025", region: "Kigali" },
        { id: 2, name: "Jean Mugabo", email: "jean.m@ubumenyi.rw", role: "Teacher", enrolled: "Dec 2024", region: "Musanze" },
        { id: 3, name: "Grace Imanzi", email: "grace.i@ubumenyi.rw", role: "Student", enrolled: "Feb 2025", region: "Huye" },
        { id: 4, name: "Dr. Theoneste Habimana", email: "theoneste@ubumenyi.rw", role: "Teacher", enrolled: "Nov 2024", region: "Kigali" },
        { id: 5, name: "Chantal Nyirabazungu", email: "chantal.n@ubumenyi.rw", role: "Student", enrolled: "Mar 2025", region: "Rubavu" }
    ];

    let activeTab = "dashboard";

    // Helper: render active panel
    function renderAdminView() {
        const container = document.getElementById("adminMainPanel");
        if (!container) return;

        if (activeTab === "dashboard") renderDashboard(container);
        else if (activeTab === "manage-content") renderManageContent(container);
        else if (activeTab === "users") renderUsers(container);
        else if (activeTab === "popular") renderPopular(container);

        attachNavEvents();
    }

    // Dashboard with statistics
    function renderDashboard(container) {
        const totalChapters = chapters.length;
        const videosCount = chapters.filter(c => c.type === "video").length;
        const booksCount = chapters.filter(c => c.type === "book").length;
        const totalUsers = platformUsers.length;
        const totalViews = chapters.reduce((sum, c) => sum + c.viewCount, 0);
        const topChapter = chapters.length ? [...chapters].sort((a,b) => b.viewCount - a.viewCount)[0] : null;

        container.innerHTML = `
            <div class="top-header">
                <div class="page-title"><i class="fas fa-chart-line"></i> Admin Dashboard — Ubumenyi Hub</div>
                <div class="admin-badge"><i class="fas fa-user-cog"></i> Platform Manager</div>
            </div>
            <div class="stats-grid">
                <div class="stat-card"><h3><i class="fas fa-layer-group"></i> Total Chapters</h3><div class="stat-number">${totalChapters}</div></div>
                <div class="stat-card"><h3><i class="fas fa-video"></i> Video Lessons</h3><div class="stat-number">${videosCount}</div></div>
                <div class="stat-card"><h3><i class="fas fa-book"></i> Digital Books</h3><div class="stat-number">${booksCount}</div></div>
                <div class="stat-card"><h3><i class="fas fa-users"></i> Registered Users</h3><div class="stat-number">${totalUsers}</div></div>
                <div class="stat-card"><h3><i class="fas fa-eye"></i> Total Views</h3><div class="stat-number">${totalViews}</div></div>
            </div>
            <div class="admin-card">
                <div class="card-header"><h2><i class="fas fa-trophy"></i> Platform Insights</h2></div>
                <div style="padding: 22px 28px;">
                    <p style="font-size: 1rem;">🏆 <strong>Most popular content:</strong> ${topChapter ? `${topChapter.title} (${topChapter.viewCount} views)` : 'N/A'}</p>
                    <p>👩‍🏫 Teachers: ${platformUsers.filter(u=>u.role==='Teacher').length} | 🧑‍🎓 Students: ${platformUsers.filter(u=>u.role==='Student').length}</p>
                    <hr style="margin: 16px 0; border-color:#e0ebe5;">
                    <p><i class="fas fa-chalkboard"></i> Ubumenyi Hub combines video lessons, digital books & online classes. Manage all chapters below.</p>
                </div>
            </div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Main Platform (Ubumenyi Hub Home)</a>
        `;
    }

    // Manage content: list all chapters, admin can add, delete, simulate views
    function renderManageContent(container) {
        container.innerHTML = `
            <div class="top-header">
                <div class="page-title"><i class="fas fa-edit"></i> Manage Chapters (Video / Books)</div>
                <button id="openAddChapterBtn" class="btn-primary"><i class="fas fa-plus"></i> Post New Chapter</button>
            </div>
            <div class="admin-card">
                <div class="card-header"><h2><i class="fas fa-table-list"></i> All Learning Resources</h2></div>
                <div style="overflow-x: auto;">
                    <table id="chaptersManageTable">
                        <thead><tr><th>Title</th><th>Type</th><th>Resource Link</th><th>Views</th><th>Actions</th></tr></thead>
                        <tbody id="chaptersTbody"></tbody>
                    </table>
                </div>
            </div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Main Site</a>
        `;
        const tbody = document.getElementById("chaptersTbody");
        if (tbody) {
            tbody.innerHTML = chapters.map(ch => `
                <tr>
                    <td><strong>${escapeHtml(ch.title)}</strong><br><small>${escapeHtml(ch.description || '')}</small></td>
                    <td><span class="badge-type ${ch.type === 'video' ? 'badge-video' : 'badge-book'}">${ch.type === 'video' ? '🎬 Video' : '📖 Book'}</span></td>
                    <td><a href="${escapeHtml(ch.url)}" target="_blank" style="color:#2c6a5c;">open ↗</a></td>
                    <td>${ch.viewCount} <button class="simulate-btn" data-id="${ch.id}">+10 views</button></td>
                    <td><button class="btn-danger" data-id="${ch.id}"><i class="fas fa-trash-alt"></i> Delete</button></td>
                </tr>
            `).join('');
            // simulate views
            document.querySelectorAll('.simulate-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    const idx = chapters.findIndex(c => c.id === id);
                    if (idx !== -1) {
                        chapters[idx].viewCount += 10;
                        renderAdminView();
                    }
                });
            });
            // delete chapters
            document.querySelectorAll('.btn-danger').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = btn.getAttribute('data-id');
                    chapters = chapters.filter(c => c.id !== id);
                    renderAdminView();
                });
            });
        }
        const openBtn = document.getElementById("openAddChapterBtn");
        if (openBtn) openBtn.onclick = () => openModal();
    }

    // Users List
    function renderUsers(container) {
        container.innerHTML = `
            <div class="top-header">
                <div class="page-title"><i class="fas fa-users"></i> Platform Users (Students & Teachers)</div>
                <div class="admin-badge">Total: ${platformUsers.length}</div>
            </div>
            <div class="admin-card">
                <div class="card-header"><h2><i class="fas fa-address-card"></i> Registered Members</h2></div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Region</th><th>Enrolled</th></tr></thead>
                        <tbody>
                            ${platformUsers.map(u => `
                                <tr>
                                    <td><i class="fas fa-user-circle"></i> ${escapeHtml(u.name)}</td>
                                    <td>${escapeHtml(u.email)}</td>
                                    <td><span class="badge-type" style="background:#e2f0ea;">${u.role}</span></td>
                                    <td>${u.region}</td>
                                    <td>${u.enrolled}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                <div style="padding: 16px 24px; border-top:1px solid #e0ebe5;">
                    📊 Teachers: ${platformUsers.filter(u=>u.role==='Teacher').length} | Students: ${platformUsers.filter(u=>u.role==='Student').length}
                </div>
            </div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Return to Platform Home</a>
        `;
    }

    // Most Viewed Section (videos and books seen many times)
    function renderPopular(container) {
        const sortedByViews = [...chapters].sort((a,b) => b.viewCount - a.viewCount);
        container.innerHTML = `
            <div class="top-header">
                <div class="page-title"><i class="fas fa-chart-simple"></i> Most Viewed Content (Video + Books)</div>
                <div><i class="fas fa-eye"></i> Engagement analytics</div>
            </div>
            <div class="admin-card">
                <div class="card-header"><h2><i class="fas fa-ranking-star"></i> Top Chapters by Views</h2></div>
                <div class="popular-list">
                    ${sortedByViews.length === 0 ? '<p>No chapters yet.</p>' : sortedByViews.map((item, idx) => `
                        <div class="popular-item">
                            <div><strong>${idx+1}. ${escapeHtml(item.title)}</strong> <span class="badge-type ${item.type === 'video' ? 'badge-video' : 'badge-book'}">${item.type === 'video' ? 'Video' : 'Book'}</span><br><small>${escapeHtml(item.description || '')}</small></div>
                            <div><span class="view-count-badge"><i class="fas fa-chart-line"></i> ${item.viewCount} views</span></div>
                        </div>
                    `).join('')}
                </div>
                <div style="padding: 18px 24px; background:#fcfefc; border-top:1px solid #e0ebe5;">
                    <i class="fas fa-lightbulb"></i> Insight: The most viewed ${sortedByViews[0] ? `"${sortedByViews[0].title}"` : 'content'} helps shape future video/book investments.
                </div>
            </div>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Explore Main Platform</a>
        `;
    }

    // Modal Logic (Add new Chapter from admin)
    function openModal() {
        const modal = document.getElementById("chapterModal");
        if (modal) modal.style.display = "flex";
    }

    function closeModal() {
        const modal = document.getElementById("chapterModal");
        if (modal) modal.style.display = "none";
        const form = document.getElementById("newChapterForm");
        if (form) form.reset();
    }

    function setupModalHandlers() {
        const modal = document.getElementById("chapterModal");
        const closeBtn = document.getElementById("closeModalBtn");
        const form = document.getElementById("newChapterForm");

        if (closeBtn) closeBtn.onclick = closeModal;
        window.onclick = (e) => { if (e.target === modal) closeModal(); };

        if (form) {
            form.addEventListener("submit", (e) => {
                e.preventDefault();
                const title = document.getElementById("chapterTitle").value.trim();
                const type = document.getElementById("chapterType").value;
                const url = document.getElementById("chapterUrl").value.trim();
                const desc = document.getElementById("chapterDesc").value.trim();
                if (!title || !url) { alert("Title and Resource URL are required."); return; }
                const newId = "ch_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
                const newChapter = {
                    id: newId,
                    title: title,
                    type: type,
                    url: url,
                    description: desc || "",
                    viewCount: 0
                };
                chapters.push(newChapter);
                closeModal();
                renderAdminView();
                alert(`✅ New ${type === 'video' ? 'Video Lesson' : 'Digital Book'} added: "${title}"`);
            });
        }
    }

    function attachNavEvents() {
        document.querySelectorAll('.nav-item').forEach(item => {
            item.removeEventListener('click', navClickHandler);
            item.addEventListener('click', navClickHandler);
        });
    }

    function navClickHandler(e) {
        const tab = this.getAttribute('data-tab');
        if (tab) {
            activeTab = tab;
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            this.classList.add('active');
            renderAdminView();
        }
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    function initAdmin() {
        renderAdminView();
        setupModalHandlers();
    }

    initAdmin();
</script>
</body>
</html>
