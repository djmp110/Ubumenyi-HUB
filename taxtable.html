<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Tax Table</title>
    <script src="/js/tabletax.js" defer></script>
    <style>
        body{
            font-family: Arial, sans-serif;
            background-image: url('/image/rwa.jpeg');
            background-size: cover;
            color:white;
            display:flex;
            justify-content:center;
            padding-top:30px;
        }

        table{
            border-collapse:collapse;
            width:800px;
            background:white;
            color:black;
        }

        th,td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        th{
            background:#4CAF50;
            color:white;
        }
        .taxcard {
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(159, 241, 131, 0.3);
            
        }
    </style>
</head>
<body>
<div class="taxcard">
<table>
    <thead>
        <tr>
            <th>Employee No</th>
            <th>Name</th>
            <th>Job</th>
            <th>Gross Salary</th>
            <th>Tax</th>
            <th>Net Salary</th>
        </tr>
    </thead>
    <tbody id="tax"></tbody>
</table>
</div>



</body>
</html>
